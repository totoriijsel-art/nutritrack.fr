<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NutriTrack PWA</title>

  <!-- PWA Metadata & Colors -->
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NutriTrack">
  
  <!-- Manifest Dynamic Data URI -->
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22NutriTrack%20Suivi%20Nutritionnel%22,
    %22short_name%22:%22NutriTrack%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22#f8fafc%22,
    %22theme_color%22:%22#1e293b%22,
    %22icons%22:[{%22src%22:%22https://placehold.co/192x192/1e293b/ffffff?text=NT%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22}]
  }">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Scrollbar personnalisée */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

  <!-- En-tête Principal -->
  <header class="bg-slate-900 text-white pt-6 pb-4 px-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-white shadow">
          <i class="fa-solid fa-utensils text-sm"></i>
        </div>
        <h1 class="font-bold text-lg tracking-tight">NutriTrack</h1>
      </div>
      <button onclick="openGoalModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded-full border border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-bullseye text-emerald-400"></i>
        <span id="targetCalsDisplay">2000 kcal</span>
      </button>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4 pb-20 overflow-y-auto">

    <!-- Carte Résumé de la Journée -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
      <div class="flex justify-between items-baseline mb-2">
        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Total Journalier</h2>
        <span id="percentText" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">0%</span>
      </div>

      <div class="flex justify-between items-baseline mb-3">
        <div>
          <span id="consumedCals" class="text-3xl font-extrabold text-slate-900">0</span>
          <span class="text-slate-400 text-sm font-medium">/ <span id="targetCals">2000</span> kcal</span>
        </div>
        <div id="remainingCals" class="text-xs font-medium text-slate-500">
          Restant : 2000 kcal
        </div>
      </div>

      <!-- Barre de progression -->
      <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden mb-4">
        <div id="progressBar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <!-- Répartition Macros -->
      <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center">
        <div class="bg-emerald-50/50 p-2 rounded-xl">
          <div class="text-xs text-slate-500 font-medium">Protéines</div>
          <div id="totalProteins" class="text-sm font-bold text-emerald-700">0g</div>
        </div>
        <div class="bg-amber-50/50 p-2 rounded-xl">
          <div class="text-xs text-slate-500 font-medium">Glucides</div>
          <div id="totalCarbs" class="text-sm font-bold text-amber-700">0g</div>
        </div>
        <div class="bg-rose-50/50 p-2 rounded-xl">
          <div class="text-xs text-slate-500 font-medium">Lipides</div>
          <div id="totalFats" class="text-sm font-bold text-rose-700">0g</div>
        </div>
      </div>
    </section>

    <!-- Formulaire d'ajout d'Aliment -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3 relative">
      <h2 class="text-sm font-semibold text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-emerald-500"></i> Ajouter un aliment
      </h2>

      <!-- Champ Recherche -->
      <div class="relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Rechercher (ex: Nutella, Filet de poulet)..." 
          oninput="handleSearch()"
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition placeholder-slate-400"
        >
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-3 text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Liste déroulante des suggestions -->
        <div id="suggestionsBox" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl z-20 max-h-56 overflow-y-auto divide-y divide-slate-100"></div>
      </div>

      <!-- Quantité et Calculateur -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Portion (g / ml)</label>
          <input 
            type="number" 
            id="portionInput" 
            value="100" 
            min="1"
            oninput="calculateMacrosForPortion()"
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
          >
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Calories estimées</label>
          <div id="displayCals" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 flex items-center">
            0 kcal
          </div>
        </div>
      </div>

      <!-- Macros manuelles / ajustées pour 100g -->
      <details class="text-xs text-slate-500 pt-1">
        <summary class="cursor-pointer font-medium hover:text-slate-700 select-none">Valeurs pour 100g (ajustables)</summary>
        <div class="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-slate-100">
          <div>
            <span class="block text-[10px]">Prot. (g)</span>
            <input type="number" id="protBase" placeholder="0" oninput="calculateMacrosForPortion()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-xs text-center">
          </div>
          <div>
            <span class="block text-[10px]">Gluc. (g)</span>
            <input type="number" id="carbBase" placeholder="0" oninput="calculateMacrosForPortion()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-xs text-center">
          </div>
          <div>
            <span class="block text-[10px]">Lip. (g)</span>
            <input type="number" id="fatBase" placeholder="0" oninput="calculateMacrosForPortion()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-xs text-center">
          </div>
        </div>
      </details>

      <button onclick="addCurrentFood()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-sm transition active:scale-[0.99]">
        Valider et Ajouter
      </button>
    </section>

    <!-- Journal des repas du jour -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-slate-400"></i> Repas enregistrés
        </h2>
        <button onclick="confirmClearDay()" class="text-xs text-rose-500 hover:text-rose-700 font-medium">
          Réinitialiser
        </button>
      </div>

      <ul id="journalList" class="divide-y divide-slate-100">
        <!-- Rempli en JavaScript -->
      </ul>

      <div id="emptyJournalMsg" class="text-center py-6 text-slate-400 text-sm">
        <i class="fa-solid fa-plate-wheat text-2xl mb-2 text-slate-300 block"></i>
        Aucun aliment enregistré aujourd'hui.
      </div>
    </section>

  </main>

  <!-- Modal Changement d'Objectif -->
  <div id="goalModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl space-y-4">
      <h3 class="font-bold text-slate-800 text-lg">Définir l'objectif calorique</h3>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Calories visées par jour (kcal)</label>
        <input type="number" id="goalInput" value="2000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div class="flex gap-2">
        <button onclick="closeGoalModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-2 rounded-xl text-sm">Annuler</button>
        <button onclick="saveGoal()" class="flex-1 bg-emerald-600 text-white font-semibold py-2 rounded-xl text-sm">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    // --- État de l'Application ---
    let targetCalories = parseInt(localStorage.getItem('nt_target_calories')) || 2000;
    let journal = JSON.parse(localStorage.getItem('nt_daily_journal')) || [];
    let selectedFoodBase = null;
    let searchDebounce = null;

    // Base de secours pour aliments bruts courants (pour pallier les manques des API de produits emballés)
    const COMMON_FOODS = [
      { name: 'Filet de poulet', cals: 110, prot: 23, carb: 0, fat: 1.5 },
      { name: 'Steak haché 5%', cals: 125, prot: 21, carb: 0, fat: 4.5 },
      { name: 'Riz basmati cuit', cals: 130, prot: 2.7, carb: 28, fat: 0.4 },
      { name: 'Pâtes cuites', cals: 131, prot: 5, carb: 25, fat: 1.1 },
      { name: 'Œuf entier (unité ~50g)', cals: 140, prot: 12.5, carb: 0.7, fat: 9.5 },
      { name: 'Banane', cals: 89, prot: 1.1, carb: 22.8, fat: 0.3 },
      { name: 'Pomme', cals: 52, prot: 0.3, carb: 13.8, fat: 0.2 },
      { name: 'Flocons d\'avoine', cals: 368, prot: 13.5, carb: 58.7, fat: 7 }
    ];

    window.onload = () => {
      document.getElementById('targetCals').innerText = targetCalories;
      document.getElementById('targetCalsDisplay').innerText = `${targetCalories} kcal`;
      document.getElementById('goalInput').value = targetCalories;
      renderJournal();
    };

    // --- Recherche d'aliments ---
    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      const clearBtn = document.getElementById('clearSearchBtn');
      const box = document.getElementById('suggestionsBox');

      if (query.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
        box.classList.add('hidden');
        return;
      }

      if (query.length < 2) return;

      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        fetchFoodSuggestions(query);
      }, 300);
    }

    async function fetchFoodSuggestions(query) {
      const box = document.getElementById('suggestionsBox');
      box.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center"><i class="fa-solid fa-spinner fa-spin"></i> Recherche...</div>';
      box.classList.remove('hidden');

      let results = [];

      // 1. Filtrer d'abord la base locale d'aliments bruts
      const localMatches = COMMON_FOODS.filter(f => f.name.toLowerCase().includes(query.toLowerCase()));
      localMatches.forEach(item => results.push({ ...item, source: 'Base Brute' }));

      // 2. Interroger l'API Open Food Facts
      try {
        const response = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=6`);
        const data = await response.json();
        
        if (data.products) {
          data.products.forEach(p => {
            const name = p.product_name_fr || p.product_name;
            if (name) {
              const nutriments = p.nutriments || {};
              results.push({
                name: name + (p.brands ? ` (${p.brands})` : ''),
                cals: Math.round(nutriments['energy-kcal_100g'] || 0),
                prot: parseFloat((nutriments['proteins_100g'] || 0).toFixed(1)),
                carb: parseFloat((nutriments['carbohydrates_100g'] || 0).toFixed(1)),
                fat: parseFloat((nutriments['fat_100g'] || 0).toFixed(1)),
                source: 'Open Food Facts'
              });
            }
          });
        }
      } catch (err) {
        console.warn("API indisponible, utilisation des résultats locaux.", err);
      }

      renderSuggestions(results);
    }

    function renderSuggestions(items) {
      const box = document.getElementById('suggestionsBox');
      box.innerHTML = '';

      if (items.length === 0) {
        box.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Aucun résultat trouvé. Remplissez les données manuellement.</div>';
        return;
      }

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'p-2.5 hover:bg-slate-50 cursor-pointer flex justify-between items-center transition';
        div.innerHTML = `
          <div class="truncate pr-2">
            <div class="font-medium text-xs text-slate-800 truncate">${item.name}</div>
            <div class="text-[10px] text-slate-400">${item.source} • P: ${item.prot}g | G: ${item.carb}g | L: ${item.fat}g</div>
          </div>
          <div class="text-xs font-bold text-emerald-600 whitespace-nowrap">${item.cals} kcal/100g</div>
        `;
        div.onclick = () => selectProduct(item);
        box.appendChild(div);
      });
    }

    function selectProduct(prod) {
      document.getElementById('searchInput').value = prod.name;
      document.getElementById('protBase').value = prod.prot;
      document.getElementById('carbBase').value = prod.carb;
      document.getElementById('fatBase').value = prod.fat;
      
      selectedFoodBase = prod;
      document.getElementById('suggestionsBox').classList.add('hidden');
      calculateMacrosForPortion();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('suggestionsBox').classList.add('hidden');
      document.getElementById('protBase').value = '';
      document.getElementById('carbBase').value = '';
      document.getElementById('fatBase').value = '';
      selectedFoodBase = null;
      calculateMacrosForPortion();
    }

    function calculateMacrosForPortion() {
      const portion = parseFloat(document.getElementById('portionInput').value) || 0;
      const prot100 = parseFloat(document.getElementById('protBase').value) || 0;
      const carb100 = parseFloat(document.getElementById('carbBase').value) || 0;
      const fat100 = parseFloat(document.getElementById('fatBase').value) || 0;

      let cals100 = (selectedFoodBase && selectedFoodBase.cals) ? selectedFoodBase.cals : Math.round(prot100 * 4 + carb100 * 4 + fat100 * 9);
      
      const totalCals = Math.round((cals100 * portion) / 100);
      document.getElementById('displayCals').innerText = `${totalCals} kcal`;
    }

    function addCurrentFood() {
      const name = document.getElementById('searchInput').value.trim() || 'Aliment rapide';
      const portion = parseFloat(document.getElementById('portionInput').value) || 100;
      const prot100 = parseFloat(document.getElementById('protBase').value) || 0;
      const carb100 = parseFloat(document.getElementById('carbBase').value) || 0;
      const fat100 = parseFloat(document.getElementById('fatBase').value) || 0;

      let cals100 = (selectedFoodBase && selectedFoodBase.cals) ? selectedFoodBase.cals : Math.round(prot100 * 4 + carb100 * 4 + fat100 * 9);
      
      const item = {
        id: Date.now(),
        name: name,
        portion: portion,
        calories: Math.round((cals100 * portion) / 100),
        protein: parseFloat(((prot100 * portion) / 100).toFixed(1)),
        carbs: parseFloat(((carb100 * portion) / 100).toFixed(1)),
        fat: parseFloat(((fat100 * portion) / 100).toFixed(1))
      };

      journal.push(item);
      saveJournal();
      renderJournal();

      clearSearch();
      document.getElementById('portionInput').value = '100';
    }

    function deleteFood(id) {
      journal = journal.filter(item => item.id !== id);
      saveJournal();
      renderJournal();
    }

    function confirmClearDay() {
      if (journal.length === 0) return;
      if (confirm('Voulez-vous vraiment effacer tous les aliments d\'aujourd\'hui ?')) {
        journal = [];
        saveJournal();
        renderJournal();
      }
    }

    function saveJournal() {
      localStorage.setItem('nt_daily_journal', JSON.stringify(journal));
    }

    function renderJournal() {
      const list = document.getElementById('journalList');
      const emptyMsg = document.getElementById('emptyJournalMsg');
      list.innerHTML = '';

      let totalCals = 0;
      let totalProt = 0;
      let totalCarbs = 0;
      let totalFats = 0;

      if (journal.length === 0) {
        emptyMsg.classList.remove('hidden');
      } else {
        emptyMsg.classList.add('hidden');
      }

      journal.forEach(item => {
        totalCals += item.calories;
        totalProt += item.protein;
        totalCarbs += item.carbs;
        totalFats += item.fat;

        const li = document.createElement('li');
        li.className = 'py-3 flex justify-between items-center text-sm';
        li.innerHTML = `
          <div class="truncate pr-2">
            <div class="font-semibold text-slate-800 truncate">${item.name}</div>
            <div class="text-xs text-slate-400 font-medium">
              ${item.portion}g • <span class="text-emerald-600">${item.protein}g P</span>, <span class="text-amber-600">${item.carbs}g G</span>, <span class="text-rose-600">${item.fat}g L</span>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold text-slate-800">${item.calories} kcal</span>
            <button onclick="deleteFood(${item.id})" class="text-slate-300 hover:text-rose-500 transition p-1">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        list.appendChild(li);
      });

      document.getElementById('consumedCals').innerText = totalCals;
      document.getElementById('totalProteins').innerText = `${totalProt.toFixed(1)}g`;
      document.getElementById('totalCarbs').innerText = `${totalCarbs.toFixed(1)}g`;
      document.getElementById('totalFats').innerText = `${totalFats.toFixed(1)}g`;

      const percent = Math.min(Math.round((totalCals / targetCalories) * 100), 100);
      document.getElementById('progressBar').style.width = `${percent}%`;
      document.getElementById('percentText').innerText = `${percent}%`;

      const remaining = targetCalories - totalCals;
      const remainingEl = document.getElementById('remainingCals');
      if (remaining >= 0) {
        remainingEl.innerText = `Restant : ${remaining} kcal`;
        remainingEl.className = 'text-xs font-medium text-slate-500';
      } else {
        remainingEl.innerText = `Dépassement : ${Math.abs(remaining)} kcal`;
        remainingEl.className = 'text-xs font-bold text-rose-500';
      }
    }

    // --- Modal Objectif ---
    function openGoalModal() {
      document.getElementById('goalModal').classList.remove('hidden');
    }

    function closeGoalModal() {
      document.getElementById('goalModal').classList.add('hidden');
    }

    function saveGoal() {
      const val = parseInt(document.getElementById('goalInput').value);
      if (val && val > 0) {
        targetCalories = val;
        localStorage.setItem('nt_target_calories', targetCalories);
        document.getElementById('targetCals').innerText = targetCalories;
        document.getElementById('targetCalsDisplay').innerText = `${targetCalories} kcal`;
        renderJournal();
        closeGoalModal();
      }
    }
  </script>
</body>
</html>
