<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack</title>
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2ecc71;
            --primary-hover: #27ae60;
            --border-color: #ddd;
            --input-bg: #fff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #27ae60;
            --primary-hover: #2ecc71;
            --border-color: #333;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            border-radius: 12px;
            mix-blend-mode: multiply; /* Enlève le fond blanc en mode clair */
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .macro-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            text-align: center;
            margin-top: 10px;
        }

        .macro-box {
            background: var(--bg-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .search-results {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            display: none;
            position: absolute;
            width: calc(100% - 30px);
            max-width: 470px;
            z-index: 10;
            border-radius: 6px;
        }

        .search-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .search-item:hover {
            background-color: var(--bg-color);
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <header>
            <div class="brand">
                <img src="logo.png" alt="Logo NutriTrack" onerror="this.style.display='none'">
                <h1>NutriTrack</h1>
            </div>
            <button onclick="toggleTheme()">🌓 Thème</button>
        </header>

        <!-- Tableau de bord / Objectifs -->
        <div class="card">
            <h3>Objectifs du jour</h3>
            <label>Date : <input type="date" id="current-date" onchange="loadDayData()"></label>
            <div>Calories cibles : <span id="target-cal">2000</span> kcal</div>
            <div class="macro-grid">
                <div class="macro-box">Cals<br><strong id="sum-cal">0</strong></div>
                <div class="macro-box">Pro<br><strong id="sum-pro">0g</strong></div>
                <div class="macro-box">Gluc<br><strong id="sum-carb">0g</strong></div>
                <div class="macro-box">Lip<br><strong id="sum-fat">0g</strong></div>
            </div>
        </div>

        <!-- Recherche et Ajout d'aliment -->
        <div class="card">
            <h3>Ajouter un aliment</h3>
            <label>Recherche (Open Food Facts)</label>
            <input type="text" id="search-input" placeholder="Ex: Yaourt, Banane..." oninput="debounceSearch()">
            <div id="search-results" class="search-results"></div>

            <label>Nom de l'aliment</label>
            <input type="text" id="food-name">

            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Quantité (g)</label>
                    <input type="number" id="food-qty" value="100" oninput="calculateMacros()">
                </div>
                <div style="flex: 1;">
                    <label>Calories (pour 100g)</label>
                    <input type="number" id="food-cal-100" oninput="calculateMacros()">
                </div>
            </div>

            <div class="macro-grid">
                <div><label>Protéines</label><input type="number" id="food-pro-100" oninput="calculateMacros()"></div>
                <div><label>Glucides</label><input type="number" id="food-carb-100" oninput="calculateMacros()"></div>
                <div><label>Lipides</label><input type="number" id="food-fat-100" oninput="calculateMacros()"></div>
            </div>

            <button onclick="addFoodEntry()" style="width: 100%; margin-top: 10px;">Ajouter au journal</button>
        </div>

        <!-- Journal du jour -->
        <div class="card">
            <h3>Journal</h3>
            <div id="food-list">Aucun aliment enregistré pour cette date.</div>
        </div>
    </div>

    <script>
        let searchCache = JSON.parse(localStorage.getItem('searchCache')) || {};
        let debounceTimer;

        // Initialisation de la date du jour
        document.getElementById('current-date').valueAsDate = new Date();
        loadDayData();

        function toggleTheme() {
            const body = document.body;
            body.dataset.theme = body.dataset.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', body.dataset.theme);
        }

        // Charger le thème enregistré
        if(localStorage.getItem('theme')) {
            document.body.dataset.theme = localStorage.getItem('theme');
        }

        function cleanFoodName(name) {
            if (!name) return '';
            return name.replace(/\s*\(.*?\)\s*/g, ' ').trim();
        }

        function debounceSearch() {
            clearTimeout(debounceTimer);
            const query = document.getElementById('search-input').value;
            if (query.length < 3) {
                document.getElementById('search-results').style.display = 'none';
                return;
            }
            debounceTimer = setTimeout(() => searchFood(query), 300);
        }

        async function searchFood(query) {
            if (searchCache[query]) {
                displayResults(searchCache[query]);
                return;
            }
            try {
                const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1`);
                const data = await res.json();
                const products = data.products.map(p => ({
                    name: cleanFoodName(p.product_name_fr || p.product_name || 'Inconnu'),
                    calories: p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal'] || 0,
                    proteins: p.nutriments['proteins_100g'] || 0,
                    carbohydrates: p.nutriments['carbohydrates_100g'] || 0,
                    fat: p.nutriments['fat_100g'] || 0
                })).filter(p => p.name);

                searchCache[query] = products;
                localStorage.setItem('searchCache', JSON.stringify(searchCache));
                displayResults(products);
            } catch (e) {
                console.error("Erreur de recherche", e);
            }
        }

        function displayResults(products) {
            const container = document.getElementById('search-results');
            container.innerHTML = '';
            if (products.length === 0) {
                container.style.display = 'none';
                return;
            }
            products.slice(0, 5).forEach(p => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerText = `${p.name} (${p.calories} kcal/100g)`;
                div.onclick = () => selectProduct(p);
                container.appendChild(div);
            });
            container.style.display = 'block';
        }

        let baseNutrients = { cal: 0, pro: 0, carb: 0, fat: 0 };

        function selectProduct(p) {
            document.getElementById('food-name').value = p.name;
            document.getElementById('food-cal-100').value = p.calories;
            document.getElementById('food-pro-100').value = p.proteins;
            document.getElementById('food-carb-100').value = p.carbohydrates;
            document.getElementById('food-fat-100').value = p.fat;
            document.getElementById('search-results').style.display = 'none';
            document.getElementById('search-input').value = '';
            calculateMacros();
        }

        function calculateMacros() {
            // Optionnel : adapter l'affichage en direct si besoin
        }

        function addFoodEntry() {
            const date = document.getElementById('current-date').value;
            const name = document.getElementById('food-name').value;
            const qty = parseFloat(document.getElementById('food-qty').value) || 0;
            const cal100 = parseFloat(document.getElementById('food-cal-100').value) || 0;
            const pro100 = parseFloat(document.getElementById('food-pro-100').value) || 0;
            const carb100 = parseFloat(document.getElementById('food-carb-100').value) || 0;
            const fat100 = parseFloat(document.getElementById('food-fat-100').value) || 0;

            if (!name || qty <= 0) return alert("Veuillez remplir le nom et la quantité.");

            const entry = {
                name,
                qty,
                cal: Math.round((cal100 * qty) / 100),
                pro: parseFloat(((pro100 * qty) / 100).toFixed(1)),
                carb: parseFloat(((carb100 * qty) / 100).toFixed(1)),
                fat: parseFloat(((fat100 * qty) / 100).toFixed(1))
            };

            let db = JSON.parse(localStorage.getItem('nutritrack_db')) || {};
            if (!db[date]) db[date] = [];
            db[date].push(entry);
            localStorage.setItem('nutritrack_db', JSON.stringify(db));

            // Reset champs
            document.getElementById('food-name').value = '';
            document.getElementById('food-qty').value = '100';
            document.getElementById('food-cal-100').value = '';
            document.getElementById('food-pro-100').value = '';
            document.getElementById('food-carb-100').value = '';
            document.getElementById('food-fat-100').value = '';

            loadDayData();
        }

        function loadDayData() {
            const date = document.getElementById('current-date').value;
            const db = JSON.parse(localStorage.getItem('nutritrack_db')) || {};
            const entries = db[date] || [];

            const listContainer = document.getElementById('food-list');
            listContainer.innerHTML = '';

            let totalCal = 0, totalPro = 0, totalCarb = 0, totalFat = 0;

            if (entries.length === 0) {
                listContainer.innerHTML = '<p style="color: #888; font-size: 0.9rem;">Aucun aliment enregistré pour cette date.</p>';
            } else {
                entries.forEach((e, index) => {
                    totalCal += e.cal;
                    totalPro += e.pro;
                    totalCarb += e.carb;
                    totalFat += e.fat;

                    const item = document.createElement('div');
                    item.style.cssText = "display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding: 8px 0;";
                    item.innerHTML = `
                        <div>
                            <strong>${e.name}</strong> (${e.qty}g)<br>
                            <small>${e.cal} kcal | P: ${e.pro}g | G: ${e.carb}g | L: ${e.fat}g</small>
                        </div>
                        <button onclick="deleteEntry('${date}', ${index})" style="background: #e74c3c; padding: 5px 10px; font-size: 0.8rem;">X</button>
                    `;
                    listContainer.appendChild(item);
                });
            }

            document.getElementById('sum-cal').innerText = totalCal;
            document.getElementById('sum-pro').innerText = totalPro.toFixed(1) + 'g';
            document.getElementById('sum-carb').innerText = totalCarb.toFixed(1) + 'g';
            document.getElementById('sum-fat').innerText = totalFat.toFixed(1) + 'g';
        }

        function deleteEntry(date, index) {
            let db = JSON.parse(localStorage.getItem('nutritrack_db')) || {};
            if (db[date]) {
                db[date].splice(index, 1);
                if (db[date].length === 0) delete db[date];
                localStorage.setItem('nutritrack_db', JSON.stringify(db));
                loadDayData();
            }
        }
    </script>
</body>
</html>
